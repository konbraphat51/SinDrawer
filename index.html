<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SinDrawer</title>
	</head>
	<body>
		<canvas id="canvas" width="800" height="600"></canvas> <br />

		<script src="HotSoupScript/Private/ModulesLoader.js"></script>
		<script src="HotSoupScript_Physics/Private/ModulesLoader.js"></script>

		<label for="text">Text</label>
		<input type="text" id="text" onchange="OnTextChanged(event)" />

		<br />

		<label for="color">Color</label>
		<input
			type="color"
			id="color"
			value="#58e08e"
			onchange="OnColorChanged(event)"
		/>

		<br />

		<label for="position">Position</label>
		<select id="position" onchange="OnPositionChanged(event)">
			<option value="rightFill">RightFill</option>
			<option value="rightTopFill">Right Top Fill</option>
			<option value="top" selected>top</option>
			<option value="topFill">topFill</option>
		</select>

		<br />

		<label for="imageWidth">Image Width (px)</label>
		<input
			type="number"
			id="imageWidth"
			value="1280"
			min="64"
			step="1"
			onchange="OnCanvasWidthChanged(event)"
		/>

		<br />

		<label for="imageHeight">Image Height (px)</label>
		<input
			type="number"
			id="imageHeight"
			value="780"
			min="64"
			step="1"
			onchange="OnCanvasHeightChanged(event)"
		/>

		<br />

		<label id="axisPositionLabel" for="axisPosition">Axis Position (%)</label>
		<input
			type="number"
			id="axisPosition"
			value="10.0"
			min="0"
			max="100"
			step="0.1"
			onchange="OnAxisPositionChanged(event)"
		/>

		<br />

		<label for="maxAmplitude">Max Amplitude (px)</label>
		<input
			type="number"
			id="maxAmplitude"
			value="20"
			min="1"
			step="1"
			onchange="OnMaxAmplitudeChanged(event)"
		/>

		<br />

		<button onclick="SaveCanvas()">Save</button>

		<!-- Write your main code here -->
		<script src="Src/main.js"></script>

		<script src="HotSoupScript/Private/MainCaller.js"></script>
	</body>
	<style>
		canvas {
			border: 1px solid black;
		}
	</style>
</html>
