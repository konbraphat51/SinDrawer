<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SinDrawer</title>
	</head>
	<body>
		<canvas id="canvas" width="800" height="600"></canvas> <br />

		<script src="HotSoupScript/Private/ModulesLoader.js"></script>
		<script src="HotSoupScript_Physics/Private/ModulesLoader.js"></script>

		<label for="text">Text</label>
		<input type="text" id="text" onchange="OnTextChanged(event)" />

		<br />

		<label for="color">Color</label>
		<input
			type="color"
			id="color"
			value="#58e08e"
			onchange="OnColorChanged(event)"
		/>

		<br />

		<label for="position">Position</label>
		<select id="position" onchange="OnPositionChanged(event)">
			<option value="rightFill">RightFill</option>
			<option value="rightTopFill" selected>Right Top Fill</option>
			<option value="top">top</option>
			<option value="topFill">topFill</option>
		</select>

		<br />

		<label for="canvasWidth">Canvas Width (px)</label>
		<input
			type="number"
			id="canvasWidth"
			value="1280"
			min="1"
			onchange="OnCanvasSizeChanged()"
		/>

		<label for="canvasHeight">Canvas Height (px)</label>
		<input
			type="number"
			id="canvasHeight"
			value="780"
			min="1"
			onchange="OnCanvasSizeChanged()"
		/>

		<br />

		<label for="axisPosition">Axis Position</label>
		<input
			type="number"
			id="axisPosition"
			value="1000"
			onchange="OnAxisPositionChanged(event)"
		/>

		<br />

		<label for="amplitudeMultiplier">Amplitude Multiplier</label>
		<input
			type="number"
			id="amplitudeMultiplier"
			value="1"
			min="0"
			step="0.1"
			onchange="OnAmplitudeMultiplierChanged(event)"
		/>

		<br />

		<button onclick="SaveCanvas()">Save</button>

		<!-- Write your main code here -->
		<script src="Src/main.js"></script>

		<script src="HotSoupScript/Private/MainCaller.js"></script>
	</body>
	<style>
		canvas {
			border: 1px solid black;
		}
	</style>
</html>
